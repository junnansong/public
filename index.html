<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋俊楠 | 山东师范大学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }

        .name {
            font-size: 3rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .school {
            font-size: 1.75rem;
            font-weight: 400;
            color: #4a4a4a;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2.25rem;
            }
            .school {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="name">宋俊楠</div>
    <div class="school">山东师范大学</div>
</body>
</html>
